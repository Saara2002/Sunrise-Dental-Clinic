<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Appointments - Sunrise Dental Clinic</title>

    <style>

        * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", Arial, Helvetica, sans-serif;
  }

body {
    background:
        linear-gradient(
            rgba(244, 248, 251, 0.88),
            rgba(244, 248, 251, 0.88)
        ),
        url("images/dental-clinic-background.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    min-height: 100vh;

    color: #334155;
}
/* =========================
SIDEBAR
========================= */

.sidebar {
width: 250px;
height: 100vh;
position: fixed;
left: 0;
top: 0;
background: linear-gradient(180deg, #075985, #087ea4);
color: white;
padding: 28px 16px;
box-shadow: 4px 0 18px rgba(0, 0, 0, 0.08);
}

.logo {
text-align: center;
margin-bottom: 38px;
}

.logo-icon {
font-size: 48px;
margin-bottom: 8px;
}

.logo h2 {
font-size: 21px;
font-weight: 700;
}

.logo p {
margin-top: 6px;
font-size: 12px;
opacity: 0.85;
}

.menu {
list-style: none;
}

.menu li {
margin-bottom: 9px;
}

.menu a {
display: block;
padding: 13px 16px;
color: white;
text-decoration: none;
border-radius: 9px;
font-size: 14px;
transition: all 0.25s ease;
}

.menu a:hover,
.menu .active {
background: rgba(255, 255, 255, 0.16);
transform: translateX(3px);
}

.logout {
margin-top: 35px;
background: #dc3545 !important;
}

.logout:hover {
background: #b91c2c !important;
}

/* =========================
MAIN CONTENT
========================= */

.main {
margin-left: 250px;
padding: 35px;
}

/* =========================
TOP BAR
========================= */

.topbar {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 28px;
}

.topbar h1 {
color: #075985;
font-size: 30px;
font-weight: 700;
}

.topbar p {
color: #6b7280;
margin-top: 6px;
font-size: 14px;
}

.add-btn {
display: inline-block;
background: linear-gradient(135deg, #087ea4, #075985);
color: white;
text-decoration: none;
padding: 13px 20px;
border-radius: 9px;
font-size: 14px;
font-weight: 600;
box-shadow: 0 5px 14px rgba(8, 126, 164, 0.22);
transition: all 0.25s ease;
}

.add-btn:hover {
transform: translateY(-2px);
box-shadow: 0 8px 18px rgba(8, 126, 164, 0.28);
}

/* =========================
SEARCH BOX
========================= */

.search-box {
background: white;
padding: 20px;
border-radius: 13px;
margin-bottom: 22px;
box-shadow: 0 5px 18px rgba(0, 0, 0, 0.07);
border: 1px solid #edf2f5;
}

.search-box input {
width: 100%;
padding: 14px 16px;
border: 1px solid #ccd6dc;
border-radius: 9px;
font-size: 15px;
outline: none;
transition: all 0.25s ease;
}

.search-box input::placeholder {
color: #9ca3af;
}

.search-box input:hover {
border-color: #9bbdca;
}

.search-box input:focus {
border-color: #087ea4;
box-shadow: 0 0 0 3px rgba(8, 126, 164, 0.12);
}

/* =========================
TABLE
========================= */

.table-container {
background: white;
padding: 22px;
border-radius: 13px;
box-shadow: 0 5px 18px rgba(0, 0, 0, 0.07);
border: 1px solid #edf2f5;
overflow-x: auto;
}

table {
width: 100%;
border-collapse: separate;
border-spacing: 0;
min-width: 800px;
}

th {
background: #075985;
color: white;
padding: 15px 12px;
text-align: left;
font-size: 13px;
font-weight: 600;
}

th:first-child {
border-radius: 8px 0 0 0;
}

th:last-child {
border-radius: 0 8px 0 0;
}

td {
padding: 14px 12px;
border-bottom: 1px solid #e8eef2;
font-size: 14px;
color: #374151;
}

tbody tr {
transition: background 0.2s ease;
}

tbody tr:hover {
background: #f3f9fc;
}

tbody tr:last-child td {
border-bottom: none;
}

/* =========================
STATUS BADGES
========================= */

.status {
display: inline-block;
padding: 6px 11px;
border-radius: 20px;
font-size: 12px;
font-weight: 700;
}

.booked {
background: #dbeafe;
color: #1d4ed8;
}

.completed {
background: #dcfce7;
color: #15803d;
}

.cancelled {
background: #fee2e2;
color: #b91c1c;
}

/* =========================
EMPTY / LOADING MESSAGE
========================= */

.empty {
text-align: center;
padding: 40px 20px;
color: #6b7280;
font-size: 14px;
}

/* =========================
RESPONSIVE DESIGN
========================= */

@media (max-width: 900px) {


.sidebar {
    width: 210px;
}

.main {
    margin-left: 210px;
    padding: 25px;
}

.topbar {
    align-items: flex-start;
    gap: 20px;
}

.topbar h1 {
    font-size: 26px;
}


}

@media (max-width: 700px) {


.sidebar {
    position: relative;
    width: 100%;
    height: auto;
    padding: 20px;
}

.logo {
    margin-bottom: 20px;
}

.menu {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
}

.menu li {
    margin-bottom: 0;
}

.logout {
    margin-top: 0;
}

.main {
    margin-left: 0;
    padding: 20px;
}

.topbar {
    flex-direction: column;
}

.add-btn {
    width: 100%;
    text-align: center;
}

.search-box {
    padding: 15px;
}

.table-container {
    padding: 15px;
}


}

@media (max-width: 450px) {


.menu {
    grid-template-columns: 1fr;
}

.topbar h1 {
    font-size: 23px;
}

.main {
    padding: 15px;
}


}
        

    </style>

</head>


<body>


    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="logo">

            <div class="logo-icon">🦷</div>

            <h2>Sunrise Dental</h2>

            <p>Receptionist Panel</p>

        </div>


        <ul class="menu">

            <li>
                <a href="receptionist-dashboard.html">
                    🏠 Dashboard
                </a>
            </li>

            <li>
                <a href="appointments.html" class="active">
                    📅 Appointments
                </a>
            </li>

            <li>
                <a href="patients.html">
                    👤 Patients
                </a>
            </li>

            <li>
                <a href="billing.html">
                    💰 Billing
                </a>
            </li>

            <li>
                <a href="help.html">
                    ❓ Help
                </a>
            </li>

            <li>
                <a href="login.html" class="logout">
                    🚪 Logout
                </a>
            </li>

        </ul>

    </div>


    <!-- MAIN -->

    <div class="main">


        <div class="topbar">

            <div>

                <h1>Appointments</h1>

                <p>
                    Manage Sunrise Dental Clinic appointments
                </p>

            </div>


            <a
                href="appointment.html"
                class="add-btn">

                ➕ New Appointment

            </a>

        </div>


        <!-- SEARCH -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search by appointment number or patient name..."
                onkeyup="searchAppointments()">

        </div>


        <!-- TABLE -->

        <div class="table-container">

            <table id="appointmentTable">

                <thead>

                    <tr>

                        <th>Appointment No</th>

                        <th>Patient</th>

                        <th>Dentist</th>

                        <th>Treatment</th>

                        <th>Date</th>

                        <th>Time</th>

                        <th>Status</th>

                    </tr>

                </thead>


                <tbody id="appointmentBody">

                    <tr>

                        <td colspan="7" class="empty">

                            Loading appointments...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


    </div>


    <script>

        function searchAppointments() {

            let input =
                document.getElementById("searchInput")
                .value
                .toLowerCase();

            let rows =
                document
                .getElementById("appointmentBody")
                .getElementsByTagName("tr");


            for (let i = 0; i < rows.length; i++) {

                let text =
                    rows[i].textContent.toLowerCase();

                if (text.includes(input)) {

                    rows[i].style.display = "";

                } else {

                    rows[i].style.display = "none";

                }

            }

        }


        /*
         * Load appointments from Servlet
         */

        fetch("appointments")
            .then(response => response.text())
            .then(data => {

                document
                    .getElementById("appointmentBody")
                    .innerHTML = data;

            })
            .catch(error => {

                document
                    .getElementById("appointmentBody")
                    .innerHTML =
                    "<tr><td colspan='7' class='empty'>" +
                    "Unable to load appointments." +
                    "</td></tr>";

            });

    </script>


</body>

</html>

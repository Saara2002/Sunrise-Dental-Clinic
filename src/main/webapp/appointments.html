<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Appointments - Sunrise Dental Clinic</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f8fb;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            height: 100vh;
            position: fixed;
            background: #075985;
            color: white;
            padding: 25px 15px;
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-icon {
            font-size: 45px;
        }

        .logo h2 {
            margin-top: 8px;
            font-size: 20px;
        }

        .logo p {
            margin-top: 5px;
            font-size: 12px;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin-bottom: 8px;
        }

        .menu a {
            display: block;
            padding: 13px 15px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .menu a:hover,
        .menu .active {
            background: #06496b;
        }

        .logout {
            margin-top: 30px;
            background: #dc3545 !important;
        }

        .main {
            margin-left: 250px;
            padding: 30px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .topbar h1 {
            color: #075985;
            font-size: 28px;
        }

        .topbar p {
            color: #666;
            margin-top: 5px;
        }

        .add-btn {
            background: #087ea4;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 7px;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #075985;
        }

        .search-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd6dc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #075985;
            color: white;
            padding: 14px 10px;
            text-align: left;
            font-size: 14px;
        }

        td {
            padding: 13px 10px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }

        tr:hover {
            background: #f8fafc;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .booked {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .completed {
            background: #dcfce7;
            color: #15803d;
        }

        .cancelled {
            background: #fee2e2;
            color: #b91c1c;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        @media (max-width: 800px) {

            .sidebar {
                width: 200px;
            }

            .main {
                margin-left: 200px;
            }

        }

    </style>

</head>


<body>


    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="logo">

            <div class="logo-icon">🦷</div>

            <h2>Sunrise Dental</h2>

            <p>Receptionist Panel</p>

        </div>


        <ul class="menu">

            <li>
                <a href="receptionist-dashboard.html">
                    🏠 Dashboard
                </a>
            </li>

            <li>
                <a href="appointments.html" class="active">
                    📅 Appointments
                </a>
            </li>

            <li>
                <a href="patients.html">
                    👤 Patients
                </a>
            </li>

            <li>
                <a href="billing.html">
                    💰 Billing
                </a>
            </li>

            <li>
                <a href="help.html">
                    ❓ Help
                </a>
            </li>

            <li>
                <a href="login.html" class="logout">
                    🚪 Logout
                </a>
            </li>

        </ul>

    </div>


    <!-- MAIN -->

    <div class="main">


        <div class="topbar">

            <div>

                <h1>Appointments</h1>

                <p>
                    Manage Sunrise Dental Clinic appointments
                </p>

            </div>


            <a
                href="appointment.html"
                class="add-btn">

                ➕ New Appointment

            </a>

        </div>


        <!-- SEARCH -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search by appointment number or patient name..."
                onkeyup="searchAppointments()">

        </div>


        <!-- TABLE -->

        <div class="table-container">

            <table id="appointmentTable">

                <thead>

                    <tr>

                        <th>Appointment No</th>

                        <th>Patient</th>

                        <th>Dentist</th>

                        <th>Treatment</th>

                        <th>Date</th>

                        <th>Time</th>

                        <th>Status</th>

                    </tr>

                </thead>


                <tbody id="appointmentBody">

                    <tr>

                        <td colspan="7" class="empty">

                            Loading appointments...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


    </div>


    <script>

        function searchAppointments() {

            let input =
                document.getElementById("searchInput")
                .value
                .toLowerCase();

            let rows =
                document
                .getElementById("appointmentBody")
                .getElementsByTagName("tr");


            for (let i = 0; i < rows.length; i++) {

                let text =
                    rows[i].textContent.toLowerCase();

                if (text.includes(input)) {

                    rows[i].style.display = "";

                } else {

                    rows[i].style.display = "none";

                }

            }

        }


        /*
         * Load appointments from Servlet
         */

        fetch("appointments")
            .then(response => response.text())
            .then(data => {

                document
                    .getElementById("appointmentBody")
                    .innerHTML = data;

            })
            .catch(error => {

                document
                    .getElementById("appointmentBody")
                    .innerHTML =
                    "<tr><td colspan='7' class='empty'>" +
                    "Unable to load appointments." +
                    "</td></tr>";

            });

    </script>


</body>

</html>

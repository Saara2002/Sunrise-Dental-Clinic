<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>New Appointment - Sunrise Dental Clinic</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    }

    body {

        background:
            linear-gradient(
                rgba(244, 248, 251, 0.88),
                rgba(244, 248, 251, 0.88)
            ),
            url("images/dental-clinic-background.png");

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;

        min-height: 100vh;

        color: #334155;
    }

    .container {

        max-width: 1050px;

        margin: 0 auto;
    }


    /* ==============================
       HEADER
    ============================== */

    .header {

        background:
            linear-gradient(
                135deg,
                #075985,
                #087ea4
            );

        color: white;

        padding: 30px 35px;

        border-radius: 16px 16px 0 0;

        box-shadow:
            0 8px 25px
            rgba(7, 89, 133, 0.18);
    }

    .header h1 {

        font-size: 30px;

        font-weight: 700;

        margin-bottom: 8px;
    }

    .header p {

        font-size: 15px;

        opacity: 0.9;
    }


    /* ==============================
       FORM CONTAINER
    ============================== */

    .form-container {

        background: #ffffff;

        padding: 40px;

        border-radius: 0 0 16px 16px;

        box-shadow:
            0 10px 30px
            rgba(0, 0, 0, 0.08);
    }


    /* ==============================
       SECTION TITLES
    ============================== */

    .section-title {

        color: #075985;

        font-size: 21px;

        font-weight: 700;

        margin-bottom: 24px;

        padding-bottom: 12px;

        border-bottom:
            2px solid #e4eef3;

        position: relative;
    }

    .section-title::after {

        content: "";

        display: block;

        width: 65px;

        height: 3px;

        background: #087ea4;

        position: absolute;

        bottom: -2px;

        left: 0;

        border-radius: 5px;
    }


    /* ==============================
       FORM GRID
    ============================== */

    .form-grid {

        display: grid;

        grid-template-columns:
            repeat(2, 1fr);

        gap: 22px 25px;

        margin-bottom: 35px;
    }

    .form-group {

        display: flex;

        flex-direction: column;
    }

    .form-group.full {

        grid-column: 1 / 3;
    }


    /* ==============================
       LABELS
    ============================== */

    label {

        font-size: 14px;

        font-weight: 600;

        color: #374151;

        margin-bottom: 8px;
    }

    .required {

        color: #dc2626;

        margin-left: 3px;
    }


    /* ==============================
       INPUTS & SELECTS
    ============================== */

    input,
    select {

        width: 100%;

        padding: 13px 14px;

        border:
            1px solid #cbd5dc;

        border-radius: 9px;

        background: #ffffff;

        color: #263238;

        font-size: 15px;

        outline: none;

        transition:
            all 0.25s ease;
    }

    input::placeholder {

        color: #9ca3af;
    }

    input:hover,
    select:hover {

        border-color: #9bbdca;
    }

    input:focus,
    select:focus {

        border-color: #087ea4;

        box-shadow:
            0 0 0 3px
            rgba(8, 126, 164, 0.12);

        background: #fbfeff;
    }


    /* ==============================
       ERROR MESSAGE
    ============================== */

    .error-message {

        color: #dc2626;

        font-size: 13px;

        margin-top: 7px;

        line-height: 1.4;
    }


    /* ==============================
       BUTTONS
    ============================== */

    .buttons {

        display: flex;

        justify-content: flex-end;

        align-items: center;

        gap: 12px;

        padding-top: 10px;

        border-top:
            1px solid #edf2f5;
    }

    button {

        min-width: 120px;

        padding: 13px 24px;

        border: none;

        border-radius: 9px;

        font-size: 15px;

        font-weight: 600;

        cursor: pointer;

        transition:
            all 0.25s ease;
    }


    /* Register Button */

    .save-btn {

        background:
            linear-gradient(
                135deg,
                #087ea4,
                #075985
            );

        color: white;

        box-shadow:
            0 5px 12px
            rgba(8, 126, 164, 0.22);
    }

    .save-btn:hover {

        transform:
            translateY(-2px);

        box-shadow:
            0 8px 18px
            rgba(8, 126, 164, 0.28);
    }


    /* Clear Button */

    .clear-btn {

        background: #eef1f3;

        color: #374151;
    }

    .clear-btn:hover {

        background: #dfe5e8;
    }


    /* Back Button */

    .back-btn {

        background: #6b7280;

        color: white;
    }

    .back-btn:hover {

        background: #4b5563;

        transform:
            translateY(-1px);
    }


    /* ==============================
       RESPONSIVE DESIGN
    ============================== */

    @media (max-width: 750px) {

        body {

            padding: 15px;
        }

        .header {

            padding: 25px;
        }

        .header h1 {

            font-size: 24px;
        }

        .form-container {

            padding: 25px 20px;
        }

        .form-grid {

            grid-template-columns: 1fr;

            gap: 18px;
        }

        .form-group.full {

            grid-column: 1;
        }

        .buttons {

            flex-direction:
                column-reverse;

            align-items: stretch;
        }

        button {

            width: 100%;
        }
    }


    @media (max-width: 450px) {

        .header h1 {

            font-size: 21px;
        }

        .header p {

            font-size: 13px;
        }

        .section-title {

            font-size: 18px;
        }

        input,
        select {

            padding: 12px;
        }
    }

</style>


</head>

<body>

<div class="container">

```
<!-- ==============================
     HEADER
============================== -->

<div class="header">

    <h1>
        🦷 Sunrise Dental Clinic
    </h1>

    <p>
        Register New Appointment
    </p>

</div>


<!-- ==============================
     FORM
============================== -->

<div class="form-container">

    <form action="appointment"
          method="post">


        <!-- =========================
             PATIENT INFORMATION
        ========================== -->

        <h2 class="section-title">

            Patient Information

        </h2>


        <div class="form-grid">


            <!-- Patient Name -->

            <div class="form-group">

                <label>

                    Patient Name

                    <span class="required">
                        *
                    </span>

                </label>

                <input
                    type="text"
                    name="patientName"
                    placeholder="Enter patient full name"
                    required>

            </div>


            <!-- Phone Number -->

            <div class="form-group">

                <label>

                    Phone Number

                    <span class="required">
                        *
                    </span>

                </label>

                <input
                    type="tel"
                    name="contactNumber"
                    placeholder="0771234567"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required>

            </div>


            <!-- Email -->

            <div class="form-group">

                <label>

                    Email

                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="example@gmail.com">

            </div>


            <!-- Date of Birth -->

            <div class="form-group">

                <label>

                    Date of Birth

                </label>

                <input
                    type="date"
                    name="dateOfBirth">

            </div>


            <!-- Address -->

            <div class="form-group full">

                <label>

                    Patient Address

                    <span class="required">
                        *
                    </span>

                </label>

                <input
                    type="text"
                    name="address"
                    placeholder="Enter patient address"
                    required>

            </div>


        </div>


        <!-- =========================
             APPOINTMENT INFORMATION
        ========================== -->

        <h2 class="section-title">

            Appointment Information

        </h2>


        <div class="form-grid">


            <!-- Dentist -->

            <div class="form-group">

                <label>

                    Dentist

                    <span class="required">
                        *
                    </span>

                </label>


                <select
                    name="dentistName"
                    id="dentistName"
                    required>

                    <option value="">

                        Loading dentists...

                    </option>

                </select>


                <div
                    id="dentistError"
                    class="error-message">

                </div>

            </div>


            <!-- Treatment -->

            <div class="form-group">

                <label>

                    Treatment

                    <span class="required">
                        *
                    </span>

                </label>


                <select
                    name="treatmentId"
                    required>

                    <option value="">

                        Select Treatment

                    </option>


                    <option value="1">

                        Dental Consultation

                    </option>


                    <option value="2">

                        Teeth Cleaning

                    </option>


                    <option value="3">

                        Dental Filling

                    </option>


                    <option value="4">

                        Tooth Extraction

                    </option>


                    <option value="5">

                        Root Canal Treatment

                    </option>


                    <option value="6">

                        Teeth Whitening

                    </option>

                </select>

            </div>


            <!-- Appointment Date -->

            <div class="form-group">

                <label>

                    Appointment Date

                    <span class="required">
                        *
                    </span>

                </label>


                <input
                    type="date"
                    name="appointmentDate"
                    id="appointmentDate"
                    required>

            </div>


            <!-- Appointment Time -->

            <div class="form-group">

                <label>

                    Appointment Time

                    <span class="required">
                        *
                    </span>

                </label>


                <input
                    type="time"
                    name="appointmentTime"
                    required>

            </div>


        </div>


        <!-- =========================
             BUTTONS
        ========================== -->

        <div class="buttons">


            <!-- Back -->

            <button
                type="button"
                class="back-btn"
                onclick="history.back()">

                Back

            </button>


            <!-- Clear -->

            <button
                type="reset"
                class="clear-btn">

                Clear

            </button>


            <!-- Register -->

            <button
                type="submit"
                class="save-btn">

                Register Appointment

            </button>


        </div>


    </form>

</div>


</div>

<script>


    // ==========================================
    // LOAD ACTIVE DENTISTS FROM DATABASE
    // ==========================================

    function loadDentists() {

        const dentistSelect =
            document.getElementById(
                "dentistName"
            );


        const dentistError =
            document.getElementById(
                "dentistError"
            );


        fetch("dentists")

            .then(function(response) {

                if (!response.ok) {

                    throw new Error(
                        "Unable to load dentists."
                    );

                }

                return response.json();

            })


            .then(function(data) {


                dentistSelect.innerHTML =
                    '<option value="">Select Dentist</option>';


                dentistError.textContent = "";


                let activeDentistCount = 0;


                data.forEach(function(dentist) {


                    if (
                        dentist.status ===
                        "ACTIVE"
                    ) {


                        const option =
                            document.createElement(
                                "option"
                            );


                        option.value =
                            dentist.dentist_name;


                        option.textContent =
                            dentist.dentist_name +
                            " - " +
                            dentist.specialization;


                        dentistSelect.appendChild(
                            option
                        );


                        activeDentistCount++;

                    }

                });


                // No active dentists

                if (
                    activeDentistCount === 0
                ) {

                    dentistSelect.innerHTML =
                        '<option value="">No active dentists available</option>';


                    dentistError.textContent =
                        "Please ask the administrator to add an active dentist.";

                }

            })


            .catch(function(error) {


                console.error(error);


                dentistSelect.innerHTML =
                    '<option value="">Unable to load dentists</option>';


                dentistError.textContent =
                    "Unable to load dentists. Please try again.";

            });

    }


    // ==========================================
    // SET MINIMUM APPOINTMENT DATE
    // ==========================================

    function setMinimumDate() {


        const dateInput =
            document.getElementById(
                "appointmentDate"
            );


        const today =
            new Date();


        const year =
            today.getFullYear();


        const month =
            String(
                today.getMonth() + 1
            ).padStart(2, "0");


        const day =
            String(
                today.getDate()
            ).padStart(2, "0");


        const formattedDate =
            year +
            "-" +
            month +
            "-" +
            day;


        dateInput.min =
            formattedDate;

    }


    // ==========================================
    // PAGE LOAD
    // ==========================================

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            loadDentists();

            setMinimumDate();

        }
    );

</script>

</body>

</html>

<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>New Appointment - Sunrise Dental Clinic</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: #f4f8fb;
        min-height: 100vh;
        padding: 30px;
    }

    .container {
        max-width: 1000px;
        margin: auto;
    }

    .header {
        background: #075985;
        color: white;
        padding: 25px 30px;
        border-radius: 12px 12px 0 0;
    }

    .header h1 {
        font-size: 27px;
        margin-bottom: 6px;
    }

    .header p {
        font-size: 14px;
    }

    .form-container {
        background: white;
        padding: 35px;
        border-radius: 0 0 12px 12px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .section-title {
        color: #075985;
        font-size: 20px;
        margin-bottom: 20px;
        padding-bottom: 8px;
        border-bottom: 2px solid #e5eef3;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 30px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
    }

    .form-group.full {
        grid-column: 1 / 3;
    }

    label {
        font-weight: bold;
        color: #333;
        margin-bottom: 8px;
    }

    .required {
        color: red;
    }

    input,
    select {
        padding: 12px;
        border: 1px solid #ccd6dc;
        border-radius: 7px;
        font-size: 15px;
        outline: none;
    }

    input:focus,
    select:focus {
        border-color: #087ea4;
        box-shadow: 0 0 5px rgba(8,126,164,0.2);
    }

    .buttons {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
    }

    button {
        padding: 13px 25px;
        border: none;
        border-radius: 7px;
        font-size: 15px;
        cursor: pointer;
        font-weight: bold;
    }

    .save-btn {
        background: #087ea4;
        color: white;
    }

    .save-btn:hover {
        background: #075985;
    }

    .clear-btn {
        background: #e5e7eb;
        color: #333;
    }

    .back-btn {
        background: #6b7280;
        color: white;
    }

    .loading {
        color: #666;
    }

    .error-message {
        color: #dc2626;
        font-size: 13px;
        margin-top: 6px;
    }

    @media (max-width: 700px) {

        .form-grid {
            grid-template-columns: 1fr;
        }

        .form-group.full {
            grid-column: 1;
        }

        body {
            padding: 10px;
        }

        .buttons {
            flex-direction: column;
        }

        button {
            width: 100%;
        }
    }

</style>


</head>

<body>

<div class="container">

</div>

<script>


    // ==========================================
    // LOAD ACTIVE DENTISTS FROM DATABASE
    // ==========================================

    function loadDentists() {

        const dentistSelect =
            document.getElementById("dentistName");

        const dentistError =
            document.getElementById("dentistError");


        fetch("dentists")

            .then(function(response) {

                if (!response.ok) {

                    throw new Error(
                        "Unable to load dentists."
                    );

                }

                return response.json();

            })


            .then(function(data) {

                dentistSelect.innerHTML =
                    '<option value="">Select Dentist</option>';

                dentistError.textContent = "";


                let activeDentistCount = 0;


                data.forEach(function(dentist) {

                    if (dentist.status === "ACTIVE") {

                        const option =
                            document.createElement("option");


                        option.value =
                            dentist.dentist_name;


                        option.textContent =
                            dentist.dentist_name +
                            " - " +
                            dentist.specialization;


                        dentistSelect.appendChild(option);


                        activeDentistCount++;

                    }

                });


                // No active dentists

                if (activeDentistCount === 0) {

                    dentistSelect.innerHTML =
                        '<option value="">No active dentists available</option>';

                    dentistError.textContent =
                        "Please ask the administrator to add an active dentist.";

                }

            })


            .catch(function(error) {

                console.error(error);


                dentistSelect.innerHTML =
                    '<option value="">Unable to load dentists</option>';


                dentistError.textContent =
                    "Unable to load dentists. Please try again.";

            });

    }


    // ==========================================
    // SET MINIMUM APPOINTMENT DATE
    // ==========================================

    function setMinimumDate() {

        const dateInput =
            document.getElementById("appointmentDate");


        const today =
            new Date();


        const year =
            today.getFullYear();


        const month =
            String(today.getMonth() + 1)
                .padStart(2, "0");


        const day =
            String(today.getDate())
                .padStart(2, "0");


        const formattedDate =
            year + "-" + month + "-" + day;


        dateInput.min =
            formattedDate;

    }


    // ==========================================
    // PAGE LOAD
    // ==========================================

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            loadDentists();

            setMinimumDate();

        }
    );


</script>

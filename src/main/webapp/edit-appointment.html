<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Appointment - Sunrise Dental Clinic</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
    background:
        linear-gradient(
            rgba(244, 248, 251, 0.88),
            rgba(244, 248, 251, 0.88)
        ),
        url("images/dental-clinic-background.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    min-height: 100vh;

    color: #334155;
}

        .container {
            max-width: 700px;
            margin: auto;
        }

        .header {
            background: #075985;
            color: white;
            padding: 25px 30px;
            border-radius: 12px 12px 0 0;
        }

        .header h1 {
            font-size: 26px;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
        }

        .form-container {
            background: white;
            padding: 35px;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd6dc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #087ea4;
        }

        input[readonly] {
            background: #f1f5f9;
            color: #666;
        }

        .buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 25px;
        }

        button,
        a {
            padding: 12px 22px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
        }

        .update-btn {
            background: #087ea4;
            color: white;
        }

        .back-btn {
            background: #6b7280;
            color: white;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="header">

        <h1>🦷 Edit Appointment</h1>

        <p>Sunrise Dental Clinic</p>

    </div>


    <div class="form-container">


        <form action="edit-appointment" method="post">


            <!-- Appointment ID -->

            <div class="form-group">

                <label>Appointment ID</label>

                <input
                    type="text"
                    id="appointmentId"
                    name="appointmentId"
                    readonly>

            </div>


            <!-- Appointment Number -->

            <div class="form-group">

                <label>Appointment Number</label>

                <input
                    type="text"
                    id="appointmentNumber"
                    name="appointmentNumber"
                    readonly>

            </div>


            <!-- Patient -->

            <div class="form-group">

                <label>Patient Name</label>

                <input
                    type="text"
                    id="patientName"
                    readonly>

            </div>


            <!-- Dentist -->

            <div class="form-group">

                <label>
                    Dentist
                </label>

                <select
                    id="dentistName"
                    name="dentistName"
                    required>

                    <option value="">
                        Select Dentist
                    </option>

                    <option value="Dr. Perera">
                        Dr. Perera
                    </option>

                    <option value="Dr. Silva">
                        Dr. Silva
                    </option>

                    <option value="Dr. Fernando">
                        Dr. Fernando
                    </option>

                </select>

            </div>


            <!-- Treatment -->

            <div class="form-group">

                <label>
                    Treatment
                </label>

                <select
                    id="treatmentId"
                    name="treatmentId"
                    required>

                    <option value="">
                        Select Treatment
                    </option>

                    <option value="1">
                        Dental Consultation
                    </option>

                    <option value="2">
                        Teeth Cleaning
                    </option>

                    <option value="3">
                        Dental Filling
                    </option>

                    <option value="4">
                        Tooth Extraction
                    </option>

                    <option value="5">
                        Root Canal Treatment
                    </option>

                    <option value="6">
                        Teeth Whitening
                    </option>

                </select>

            </div>


            <!-- Date -->

            <div class="form-group">

                <label>
                    Appointment Date
                </label>

                <input
                    type="date"
                    id="appointmentDate"
                    name="appointmentDate"
                    required>

            </div>


            <!-- Time -->

            <div class="form-group">

                <label>
                    Appointment Time
                </label>

                <input
                    type="time"
                    id="appointmentTime"
                    name="appointmentTime"
                    required>

            </div>


            <div class="buttons">

                <a
                    href="appointments.html"
                    class="back-btn">

                    Back

                </a>


                <button
                    type="submit"
                    class="update-btn">

                    💾 Update Appointment

                </button>

            </div>


        </form>


    </div>

</div>


<script>

    /*
     * Get appointment ID from URL
     *
     * Example:
     * edit-appointment.html?id=1
     */

    const params =
        new URLSearchParams(window.location.search);

    const appointmentId =
        params.get("id");


    if (!appointmentId) {

        alert("Appointment ID not found.");

        window.location.href =
            "appointments.html";

    }


    /*
     * Load appointment details
     */

    fetch("edit-appointment?id=" + appointmentId)

        .then(response => response.json())

        .then(data => {


            if (data.error) {

                alert(data.error);

                window.location.href =
                    "appointments.html";

                return;

            }


            document.getElementById(
                "appointmentId"
            ).value = data.appointmentId;


            document.getElementById(
                "appointmentNumber"
            ).value = data.appointmentNumber;


            document.getElementById(
                "patientName"
            ).value = data.patientName;


            document.getElementById(
                "dentistName"
            ).value = data.dentistName;


            document.getElementById(
                "treatmentId"
            ).value = data.treatmentId;


            document.getElementById(
                "appointmentDate"
            ).value = data.appointmentDate;


            document.getElementById(
                "appointmentTime"
            ).value = data.appointmentTime;

        })


        .catch(error => {

            console.log(error);

            alert(
                "Unable to load appointment details."
            );

        });

</script>


</body>

</html>

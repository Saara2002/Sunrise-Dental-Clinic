<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Receptionist Dashboard - Sunrise Dental Clinic</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f8fb;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            height: 100vh;
            position: fixed;
            background: #087ea4;
            color: white;
            padding: 25px 15px;
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-icon {
            font-size: 45px;
        }

        .logo h2 {
            margin-top: 8px;
            font-size: 20px;
        }

        .logo p {
            margin-top: 5px;
            font-size: 12px;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin-bottom: 8px;
        }

        .menu a {
            display: block;
            padding: 13px 15px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .menu a:hover,
        .menu .active {
            background: #075985;
        }

        .logout {
            margin-top: 30px;
            background: #dc3545 !important;
        }

        .main {
            margin-left: 250px;
            padding: 30px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .topbar h1 {
            color: #075985;
            font-size: 28px;
        }

        .user-info {
            background: white;
            padding: 10px 18px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .card-icon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .card h3 {
            color: #555;
            font-size: 15px;
            margin-bottom: 8px;
        }

        .number {
            color: #075985;
            font-size: 28px;
            font-weight: bold;
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .panel h2 {
            color: #075985;
            margin-bottom: 20px;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .action-button {
            padding: 18px;
            border: none;
            border-radius: 8px;
            background: #087ea4;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .action-button:hover {
            background: #075985;
        }

    </style>
</head>

<body>

    <div class="sidebar">

        <div class="logo">

            <div class="logo-icon">🦷</div>

            <h2>Sunrise Dental</h2>

            <p>Receptionist Panel</p>

        </div>

        <ul class="menu">

            <li>
                <a href="appointments.html">📅 Appointments</a>
            </li>

           
            <li>
                <a href="patients.html">👤 Patients</a>
            </li>

            <li>
                <a href="billing.html">💰 Billing</a>
            </li>

            <li>
                <a href="help.html">❓ Help</a>
            </li>

            <li>
                <a href="login.html" class="logout">🚪 Logout</a>
            </li>

        </ul>

    </div>


    <div class="main">

        <div class="topbar">

            <div>

                <h1>Receptionist Dashboard</h1>

                <p>Sunrise Dental Clinic Management System</p>

            </div>

            <div class="user-info">
                👩‍💼 <strong>Receptionist</strong>
            </div>

        </div>


        <div class="cards">

            <div class="card">

                <div class="card-icon">📅</div>

                <h3>Today's Appointments</h3>

                <div class="card-number" id="todayAppointments">0</div>

            </div>


            <div class="card">

                <div class="card-icon">👥</div>

                <h3>Total Patients</h3>

                <div class="card-number" id="totalPatients">0</div>

            </div>


            <div class="card">

                <div class="card-icon">⏳</div>

                <h3>Pending Appointments</h3>

                <div class="card-number" id="pendingAppointments">0</div>

            </div>

        </div>


        <div class="panel">

            <h2>Quick Actions</h2>

            <div class="actions">

                <button
              
              
             class="action-button"
    onclick="window.location.href='appointment.html'">

    ➕ Register Appointment

</button>

                <button 
                
                class="action-button"
    onclick="window.location.href='appointments.html'">
                    🔍 Search Appointment
                </button>

                <button 
                class="action-button"
    onclick="window.location.href='appointments.html'">
                    ✏️ Edit Appointment
                </button>

                <button 
                class="action-button"
    onclick="window.location.href='appointments.html'">
                    ❌ Cancel Appointment
                </button>

                <button 
                class="action-button"
    onclick="window.location.href='appointments.html'">
                    ✅ Complete Appointment
                </button>

                <button
    class="action-button"
    onclick="window.location.href='billing.html'">

    💰 Generate Bill

</button>

            </div>

        </div>

    </div>
    
    <script>

function loadDashboardStats() {

    fetch("receptionist-dashboard")

        .then(response => response.json())

        .then(data => {

            if (data.error) {
                console.log("Database Error:", data.error);
                return;
            }

            document.getElementById("todayAppointments")
                .textContent = data.todayAppointments;

            document.getElementById("totalPatients")
                .textContent = data.totalPatients;

            document.getElementById("pendingAppointments")
                .textContent = data.pendingAppointments;

        })

        .catch(error => {

            console.log(
                "Dashboard Error:",
                error
            );

        });
}


// Load dashboard numbers
loadDashboardStats();

</script>

</body>

</html>

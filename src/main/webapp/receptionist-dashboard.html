<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Receptionist Dashboard - Sunrise Dental Clinic</title>


<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    }

    body {
    background:
        linear-gradient(
            rgba(244, 248, 251, 0.88),
            rgba(244, 248, 251, 0.88)
        ),
        url("images/dental-clinic-background.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    min-height: 100vh;

    color: #334155;
}

    /* Sidebar */
    .sidebar {
        width: 255px;
        height: 100vh;
        position: fixed;
        left: 0;
        top: 0;
        background: linear-gradient(180deg, #075985, #087ea4);
        color: white;
        padding: 28px 16px;
        box-shadow: 5px 0 20px rgba(0, 0, 0, 0.08);
    }

    .logo {
        text-align: center;
        margin-bottom: 40px;
        padding-bottom: 25px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.18);
    }

    .logo-icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.14);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }

    .logo h2 {
        margin-top: 8px;
        font-size: 21px;
        font-weight: 700;
    }

    .logo p {
        margin-top: 6px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.78);
    }

    .menu {
        list-style: none;
    }

    .menu li {
        margin-bottom: 9px;
    }

    .menu a {
        display: flex;
        align-items: center;
        padding: 13px 15px;
        color: white;
        text-decoration: none;
        border-radius: 10px;
        font-size: 14px;
        transition: all 0.25s ease;
    }

    .menu a:hover,
    .menu .active {
        background: rgba(255, 255, 255, 0.15);
        transform: translateX(3px);
    }

    .logout {
        margin-top: 35px;
        background: rgba(220, 53, 69, 0.95) !important;
    }

    .logout:hover {
        background: #c82333 !important;
    }

    /* Main Content */
    .main {
        margin-left: 255px;
        padding: 35px;
    }

    .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 35px;
    }

    .topbar h1 {
        color: #075985;
        font-size: 30px;
        font-weight: 700;
        margin-bottom: 6px;
    }

    .topbar p {
        color: #64748b;
        font-size: 14px;
    }

    .user-info {
        background: white;
        padding: 12px 20px;
        border-radius: 12px;
        color: #334155;
        border: 1px solid #e2e8f0;
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);
    }

    /* Dashboard Cards */
    .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 22px;
        margin-bottom: 30px;
    }

    .card {
        background: white;
        padding: 25px;
        border-radius: 16px;
        border: 1px solid #e5edf2;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        transition: all 0.25s ease;
    }

    .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 14px 30px rgba(7, 89, 133, 0.12);
    }

    .card-icon {
        width: 52px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 17px;
        border-radius: 12px;
        background: #e6f7fb;
        font-size: 27px;
    }

    .card h3 {
        color: #64748b;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
    }

    /* Supports both existing .card-number and .number */
    .card-number,
    .number {
        color: #075985;
        font-size: 32px;
        font-weight: 700;
    }

    /* Quick Actions Panel */
    .panel {
        background: white;
        padding: 28px;
        border-radius: 16px;
        border: 1px solid #e5edf2;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
    }

    .panel h2 {
        color: #075985;
        font-size: 21px;
        margin-bottom: 22px;
    }

    .actions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
    }

    .action-button {
        padding: 17px 14px;
        border: none;
        border-radius: 11px;
        background: linear-gradient(135deg, #0891b2, #075985);
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 6px 15px rgba(7, 89, 133, 0.15);
        transition: all 0.25s ease;
    }

    .action-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 22px rgba(7, 89, 133, 0.22);
    }

    .action-button:active {
        transform: translateY(0);
    }

    /* Responsive */
    @media (max-width: 1000px) {
        .cards,
        .actions {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 750px) {
        .sidebar {
            width: 100%;
            height: auto;
            position: relative;
        }

        .main {
            margin-left: 0;
            padding: 25px;
        }

        .topbar {
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
        }

        .cards,
        .actions {
            grid-template-columns: 1fr;
        }
    }
</style>


</head>

<body>

    <div class="sidebar">

        <div class="logo">

            <div class="logo-icon">🦷</div>

            <h2>Sunrise Dental</h2>

            <p>Receptionist Panel</p>

        </div>

        <ul class="menu">

            <li>
                <a href="appointments.html">📅 Appointments</a>
            </li>

           
            <li>
                <a href="patients.html">👤 Patients</a>
            </li>

            <li>
                <a href="billing.html">💰 Billing</a>
            </li>

            <li>
                <a href="help.html">❓ Help</a>
            </li>

            <li>
                <a href="login.html" class="logout">🚪 Logout</a>
            </li>

        </ul>

    </div>


    <div class="main">

        <div class="topbar">

            <div>

                <h1>Receptionist Dashboard</h1>

                <p>Sunrise Dental Clinic Management System</p>

            </div>

            <div class="user-info">
                👩‍💼 <strong>Receptionist</strong>
            </div>

        </div>


        <div class="cards">

            <div class="card">

                <div class="card-icon">📅</div>

                <h3>Today's Appointments</h3>

                <div class="card-number" id="todayAppointments">0</div>

            </div>


            <div class="card">

                <div class="card-icon">👥</div>

                <h3>Total Patients</h3>

                <div class="card-number" id="totalPatients">0</div>

            </div>


            <div class="card">

                <div class="card-icon">⏳</div>

                <h3>Pending Appointments</h3>

                <div class="card-number" id="pendingAppointments">0</div>

            </div>

        </div>


        <div class="panel">

            <h2>Quick Actions</h2>

            <div class="actions">

                <button
              
              
             class="action-button"
    onclick="window.location.href='appointment.html'">

    ➕ Register Appointment

</button>

                <button 
                
                class="action-button"
    onclick="window.location.href='appointments.html'">
                    🔍 Search Appointment
                </button>

                <button 
                class="action-button"
    onclick="window.location.href='appointments.html'">
                    ✏️ Edit Appointment
                </button>

                <button 
                class="action-button"
    onclick="window.location.href='appointments.html'">
                    ❌ Cancel Appointment
                </button>

                <button 
                class="action-button"
    onclick="window.location.href='appointments.html'">
                    ✅ Complete Appointment
                </button>

                <button
    class="action-button"
    onclick="window.location.href='billing.html'">

    💰 Generate Bill

</button>

            </div>

        </div>

    </div>
    
    <script>

function loadDashboardStats() {

    fetch("receptionist-dashboard")

        .then(response => response.json())

        .then(data => {

            if (data.error) {
                console.log("Database Error:", data.error);
                return;
            }

            document.getElementById("todayAppointments")
                .textContent = data.todayAppointments;

            document.getElementById("totalPatients")
                .textContent = data.totalPatients;

            document.getElementById("pendingAppointments")
                .textContent = data.pendingAppointments;

        })

        .catch(error => {

            console.log(
                "Dashboard Error:",
                error
            );

        });
}


// Load dashboard numbers
loadDashboardStats();

</script>

</body>

</html>

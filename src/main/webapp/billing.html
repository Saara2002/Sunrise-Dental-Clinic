
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Billing - Sunrise Dental Clinic</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #333;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 240px;
            background: #0b4f6c;
            color: white;
            padding: 25px 15px;
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo .icon {
            font-size: 40px;
        }

        .logo h2 {
            font-size: 20px;
            margin-top: 8px;
        }

        .logo p {
            font-size: 12px;
            opacity: 0.8;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin-bottom: 8px;
        }

        .menu a {
            display: block;
            padding: 13px 15px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 15px;
        }

        .menu a:hover,
        .menu a.active {
            background: #087ea4;
        }

        /* MAIN */

        .main {
            flex: 1;
            padding: 30px;
        }

        .topbar {
            margin-bottom: 25px;
        }

        .topbar h1 {
            color: #0b4f6c;
            font-size: 28px;
        }

        .topbar p {
            color: #777;
            margin-top: 5px;
        }

        .billing-card {
            background: white;
            max-width: 800px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            background: white;
        }

        select:focus {
            outline: none;
            border-color: #087ea4;
        }

        /* RECEIPT PREVIEW */

        .receipt-preview {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #fafafa;
            border: 1px dashed #aaa;
            border-radius: 8px;
        }

        .receipt-preview h3 {
            text-align: center;
            color: #0b4f6c;
            margin-bottom: 15px;
        }

        .preview-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dotted #ccc;
        }

        .preview-row:last-child {
            border-bottom: none;
        }

        .preview-label {
            font-weight: bold;
        }

        .total-preview {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 2px solid #0b4f6c;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            color: #0b4f6c;
        }

        .payment-status {
            margin-top: 20px;
        }

        /* BUTTONS */

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            font-weight: bold;
        }

        .btn-print {
            background: #0b4f6c;
            color: white;
        }

        .btn-print:hover {
            background: #087ea4;
        }

        .btn-back {
            background: #087ea4;
            color: white;
        }

        .btn-back:hover {
            background: #0b4f6c;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            color: #d9534f;
            font-weight: bold;
        }

        @media (max-width: 700px) {

            .sidebar {
                width: 190px;
            }

            .main {
                padding: 15px;
            }

            .billing-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            <div class="icon">🦷</div>

            <h2>Sunrise Dental</h2>

            <p>Clinic Management System</p>
        </div>

        <ul class="menu">

            <li>
                <a href="receptionist-dashboard.html">
                    🏠 Dashboard
                </a>
            </li>

            <li>
                <a href="appointments.html">
                    📅 Appointments
                </a>
            </li>

            <li>
                <a href="patients.html">
                    👤 Patients
                </a>
            </li>

            <li>
                <a href="billing.html" class="active">
                    💰 Billing
                </a>
            </li>

            <li>
                <a href="help.html">
                    ❓ Help
                </a>
            </li>

            <li>
                <a href="login.html">
                    🚪 Logout
                </a>
            </li>

        </ul>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="main">

        <div class="topbar">

            <h1>💰 Billing</h1>

            <p>
                Generate thermal printer style payment receipts
            </p>

        </div>


        <div class="billing-card">

            <form action="billing" method="post">

                <!-- SELECT APPOINTMENT -->

                <div class="form-group">

                    <label for="appointmentId">
                        Select Completed Appointment
                    </label>

                    <select
                        id="appointmentId"
                        name="appointmentId"
                        onchange="loadAppointment()"
                        required>

                        <option value="">
                            Loading appointments...
                        </option>

                    </select>

                </div>


                <!-- RECEIPT PREVIEW -->

                <div
                    class="receipt-preview"
                    id="receiptPreview">

                    <h3>
                        🧾 Receipt Preview
                    </h3>


                    <div class="preview-row">

                        <span class="preview-label">
                            Patient
                        </span>

                        <span id="patientName">
                            -
                        </span>

                    </div>


                    <div class="preview-row">

                        <span class="preview-label">
                            Appointment
                        </span>

                        <span id="appointmentNumber">
                            -
                        </span>

                    </div>


                    <div class="preview-row">

                        <span class="preview-label">
                            Treatment
                        </span>

                        <span id="treatmentName">
                            -
                        </span>

                    </div>


                    <div class="total-preview">

                        <span>
                            TOTAL
                        </span>

                        <span id="amount">
                            Rs. 0.00
                        </span>

                    </div>

                </div>


                <!-- HIDDEN VALUES -->

                <input
                    type="hidden"
                    name="patientId"
                    id="patientId">

                <input
                    type="hidden"
                    name="treatmentId"
                    id="treatmentId">

                <input
                    type="hidden"
                    name="amount"
                    id="amountInput">


                <!-- PAYMENT STATUS -->

                <div class="form-group payment-status">

                    <label for="paymentStatus">
                        Payment Status
                    </label>

                    <select
                        id="paymentStatus"
                        name="paymentStatus"
                        required>

                        <option value="PENDING">
                            PENDING
                        </option>

                        <option value="PAID">
                            PAID
                        </option>

                    </select>

                </div>


                <!-- BUTTONS -->

                <div class="buttons">

                    <a
                        href="receptionist-dashboard.html"
                        class="btn btn-back">

                        ← Back

                    </a>

                    <button
                        type="submit"
                        class="btn btn-print">

                        🧾 Generate Receipt

                    </button>

                </div>

            </form>


            <div
                class="message"
                id="message">
            </div>

        </div>

    </main>

</div>


<script>

    const appointmentSelect =
        document.getElementById("appointmentId");

    const receiptPreview =
        document.getElementById("receiptPreview");

    const patientName =
        document.getElementById("patientName");

    const appointmentNumber =
        document.getElementById("appointmentNumber");

    const treatmentName =
        document.getElementById("treatmentName");

    const amount =
        document.getElementById("amount");

    const patientId =
        document.getElementById("patientId");

    const treatmentId =
        document.getElementById("treatmentId");

    const amountInput =
        document.getElementById("amountInput");

    const message =
        document.getElementById("message");


    /* LOAD COMPLETED APPOINTMENTS */

    fetch("billing?action=list")

        .then(function(response) {

            if (!response.ok) {

                throw new Error(
                    "Unable to load appointments."
                );
            }

            return response.json();

        })

        .then(function(data) {

            appointmentSelect.innerHTML =
                '<option value="">Select Completed Appointment</option>';


            if (data.length === 0) {

                appointmentSelect.innerHTML =
                    '<option value="">No completed appointments available</option>';

                return;
            }


            data.forEach(function(item) {

                const option =
                    document.createElement("option");


                option.value =
                    item.appointmentId;


                option.textContent =
                    item.appointmentNumber +
                    " - " +
                    item.patientName +
                    " - " +
                    item.treatmentName;


                appointmentSelect.appendChild(
                    option
                );

            });

        })

        .catch(function(error) {

            console.error(error);

            appointmentSelect.innerHTML =
                '<option value="">Unable to load appointments</option>';


            message.textContent =
                "Unable to load completed appointments.";

        });


    /* LOAD APPOINTMENT DETAILS */

    function loadAppointment() {

        const id =
            appointmentSelect.value;


        if (!id) {

            receiptPreview.style.display =
                "none";

            return;
        }


        fetch(
            "billing?action=details&id=" +
            encodeURIComponent(id)
        )

        .then(function(response) {

            if (!response.ok) {

                throw new Error(
                    "Unable to load appointment details."
                );
            }

            return response.json();

        })

        .then(function(data) {

            patientName.textContent =
                data.patientName;


            appointmentNumber.textContent =
                data.appointmentNumber;


            treatmentName.textContent =
                data.treatmentName;


            amount.textContent =
                "Rs. " +
                Number(data.amount).toLocaleString(
                    "en-LK",
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                );


            patientId.value =
                data.patientId;


            treatmentId.value =
                data.treatmentId;


            amountInput.value =
                data.amount;


            receiptPreview.style.display =
                "block";

        })

        .catch(function(error) {

            console.error(error);

            message.textContent =
                "Unable to load appointment details.";

        });

    }

</script>

</body>
</html>

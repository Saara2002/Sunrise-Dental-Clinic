<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>User Management - Sunrise Dental Clinic</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f4f7fb;
        color: #333;
    }

    /* =========================
       SIDEBAR
       ========================= */

    .sidebar {
        width: 240px;
        height: 100vh;
        background: #123c69;
        position: fixed;
        left: 0;
        top: 0;
        padding: 25px 15px;
    }

    .logo {
        color: white;
        text-align: center;
        margin-bottom: 35px;
    }

    .logo h2 {
        font-size: 22px;
    }

    .logo p {
        font-size: 12px;
        margin-top: 5px;
    }

    .menu {
        list-style: none;
    }

    .menu li {
        margin-bottom: 10px;
    }

    .menu a {
        display: block;
        text-decoration: none;
        color: white;
        padding: 13px 15px;
        border-radius: 8px;
    }

    .menu a:hover,
    .menu a.active {
        background: #1f5f9c;
    }


    /* =========================
       MAIN
       ========================= */

    .main {
        margin-left: 240px;
        padding: 30px;
    }

    .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
    }

    .topbar h1 {
        color: #123c69;
    }

    .admin-name {
        background: white;
        padding: 10px 18px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }


    /* =========================
       CARD
       ========================= */

    .card {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .card-header h2 {
        color: #123c69;
    }


    /* =========================
       ADD BUTTON
       ========================= */

    .add-btn {
        background: #123c69;
        color: white;
        border: none;
        padding: 11px 18px;
        border-radius: 7px;
        cursor: pointer;
    }

    .add-btn:hover {
        background: #1f5f9c;
    }


    /* =========================
       TABLE
       ========================= */

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th,
    td {
        padding: 14px;
        text-align: left;
        border-bottom: 1px solid #ddd;
    }

    th {
        background: #f0f4f8;
        color: #123c69;
    }

    .role {
        padding: 5px 10px;
        border-radius: 15px;
        font-size: 12px;
        background: #e8f1fb;
        color: #123c69;
    }


    /* =========================
       ACTION BUTTONS
       ========================= */

    .edit-btn {
        background: #2e7d32;
        color: white;
        border: none;
        padding: 7px 12px;
        border-radius: 5px;
        cursor: pointer;
        margin-right: 5px;
    }

    .edit-btn:hover {
        background: #1b5e20;
    }

    .delete-btn {
        background: #c62828;
        color: white;
        border: none;
        padding: 7px 12px;
        border-radius: 5px;
        cursor: pointer;
    }

    .delete-btn:hover {
        background: #8e0000;
    }


    /* =========================
       LOADING / ERROR
       ========================= */

    .loading {
        text-align: center;
        padding: 25px;
        color: #777;
    }

    .error {
        text-align: center;
        padding: 25px;
        color: #c62828;
    }


    /* =========================
       MODAL
       ========================= */

    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }

    .modal-content {
        background: white;
        width: 420px;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 5px 25px rgba(0,0,0,0.2);
    }

    .modal-content h2 {
        color: #123c69;
        margin-bottom: 25px;
    }


    /* =========================
       FORM
       ========================= */

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #444;
    }

    .form-group input,
    .form-group select {
        width: 100%;
        padding: 11px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
    }

    .form-group input:focus,
    .form-group select:focus {
        outline: none;
        border-color: #123c69;
    }


    /* =========================
       MODAL BUTTONS
       ========================= */

    .modal-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 25px;
    }

    .cancel-btn {
        background: #777;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 6px;
        cursor: pointer;
    }

    .cancel-btn:hover {
        background: #555;
    }

    .save-btn {
        background: #123c69;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 6px;
        cursor: pointer;
    }

    .save-btn:hover {
        background: #1f5f9c;
    }

</style>


</head>

```

<!-- =========================
     ADD USER MODAL
     ========================= -->

<div id="addUserModal"
     class="modal">


    <div class="modal-content">


        <h2>Add New User</h2>


        <div class="form-group">

            <label for="newUsername">

                Username

            </label>

            <input type="text"
                   id="newUsername"
                   placeholder="Enter username">

        </div>


        <div class="form-group">

            <label for="newPassword">

                Password

            </label>

            <input type="password"
                   id="newPassword"
                   placeholder="Enter password">

        </div>


        <div class="form-group">

            <label for="newRole">

                Role

            </label>

            <select id="newRole">

                <option value="RECEPTIONIST">

                    RECEPTIONIST

                </option>

                <option value="ADMIN">

                    ADMIN

                </option>

            </select>

        </div>


        <div class="modal-buttons">


            <button class="cancel-btn"

<!-- =========================
     EDIT USER MODAL
     ========================= -->

<div id="editUserModal"
     class="modal">


    <div class="modal-content">


        <h2>Edit User</h2>


        <input type="hidden"
               id="editUserId">


        <div class="form-group">

            <label for="editUsername">

                Username

            </label>

            <input type="text"
                   id="editUsername"
                   placeholder="Enter username">

        </div>


        <div class="form-group">

            <label for="editPassword">

                New Password

            </label>

            <input type="password"
                   id="editPassword"
                   placeholder="Leave empty to keep current password">

        </div>


        <div class="form-group">

            <label for="editRole">

                Role

            </label>

            <select id="editRole">

                <option value="RECEPTIONIST">

                    RECEPTIONIST

                </option>

                <option value="ADMIN">

                    ADMIN

                </option>

            </select>

        </div>


        <div class="modal-buttons">


            <button class="cancel-btn"
                    onclick="closeEditUserForm()">

                Cancel

            </button>


            <button class="save-btn"
                    onclick="updateUser()">

                Save Changes

            </button>


        </div>

    </div>

</div>



<!-- =========================
     JAVASCRIPT
     ========================= -->

<script>


    // ==========================================
    // LOAD USERS
    // ==========================================

    function loadUsers() {


        fetch("user-management")


            .then(response => {


                if (!response.ok) {

                    throw new Error(
                        "Server returned an error"
                    );

                }


                return response.json();

            })


            .then(users => {


                const tableBody =
                    document.getElementById(
                        "userTableBody"
                    );


                tableBody.innerHTML = "";


                if (users.length === 0) {


                    tableBody.innerHTML = `

                        <tr>

                            <td colspan="5"
                                class="loading">

                                No users found.

                            </td>

                        </tr>

                    `;


                    return;

                }


                users.forEach(user => {


                    const row =
                        document.createElement("tr");


                    row.innerHTML = `

                        <td>
                            ${user.user_id}
                        </td>

                        <td>
                            ${user.username}
                        </td>

                        <td>

                            <span class="role">

                                ${user.role}

                            </span>

                        </td>

                        <td>
                            ${user.created_at}
                        </td>

                        <td>


                            <button
                                class="edit-btn"
                                onclick="editUser(${user.user_id})">

                                Edit

                            </button>


                            <button
                                class="delete-btn"
                                onclick="deleteUser(${user.user_id})">

                                Delete

                            </button>


                        </td>

                    `;


                    tableBody.appendChild(row);

                });

            })


            .catch(error => {


                console.error(
                    "User Management Error:",
                    error
                );


                document.getElementById(
                    "userTableBody"
                ).innerHTML = `

                    <tr>

                        <td colspan="5"
                            class="error">

                            Unable to load users.

                            <br>

                            Please check the server.

                        </td>

                    </tr>

                `;

            });

    }



    // ==========================================
    // OPEN ADD USER FORM
    // ==========================================

    function openAddUserForm() {


        document.getElementById(
            "addUserModal"
        ).style.display = "flex";

    }



    // ==========================================
    // CLOSE ADD USER FORM
    // ==========================================

    function closeAddUserForm() {


        document.getElementById(
            "addUserModal"
        ).style.display = "none";


        document.getElementById(
            "newUsername"
        ).value = "";


        document.getElementById(
            "newPassword"
        ).value = "";


        document.getElementById(
            "newRole"
        ).value = "RECEPTIONIST";

    }



    // ==========================================
    // ADD USER
    // ==========================================

    function addUser() {


        const username =
            document.getElementById(
                "newUsername"
            ).value.trim();


        const password =
            document.getElementById(
                "newPassword"
            ).value;


        const role =
            document.getElementById(
                "newRole"
            ).value;


        // Validation

        if (username === "") {

            alert(
                "Please enter a username."
            );

            return;

        }


        if (password === "") {

            alert(
                "Please enter a password."
            );

            return;

        }


        if (password.length < 6) {

            alert(
                "Password must contain at least 6 characters."
            );

            return;

        }


        // Form Data

        const formData =
            new URLSearchParams();


        // IMPORTANT

        formData.append(
            "action",
            "add"
        );


        formData.append(
            "username",
            username
        );


        formData.append(
            "password",
            password
        );


        formData.append(
            "role",
            role
        );


        // Send to Servlet

        fetch("user-management", {

            method: "POST",

            headers: {

                "Content-Type":
                    "application/x-www-form-urlencoded"

            },

            body: formData

        })


        .then(response => {

            return response.json();

        })


        .then(data => {


            if (data.success) {


                alert(
                    "User added successfully!"
                );


                closeAddUserForm();


                loadUsers();


            } else {


                alert(
                    data.message ||
                    "Unable to add user."
                );

            }

        })


        .catch(error => {


            console.error(
                "Add User Error:",
                error
            );


            alert(
                "Unable to add user. Please check the server."
            );

        });

    }



    // ==========================================
    // EDIT USER
    // ==========================================

    function editUser(userId) {


        fetch("user-management")


            .then(response => {

                return response.json();

            })


            .then(users => {


                const user =
                    users.find(
                        u =>
                        Number(u.user_id)
                        ===
                        Number(userId)
                    );


                if (!user) {

                    alert(
                        "User not found."
                    );

                    return;

                }


                document.getElementById(
                    "editUserId"
                ).value =
                    user.user_id;


                document.getElementById(
                    "editUsername"
                ).value =
                    user.username;


                document.getElementById(
                    "editRole"
                ).value =
                    user.role;


                document.getElementById(
                    "editPassword"
                ).value =
                    "";


                document.getElementById(
                    "editUserModal"
                ).style.display =
                    "flex";

            })


            .catch(error => {


                console.error(
                    "Edit User Error:",
                    error
                );


                alert(
                    "Unable to load user."
                );

            });

    }



    // ==========================================
    // CLOSE EDIT USER FORM
    // ==========================================

    function closeEditUserForm() {


        document.getElementById(
            "editUserModal"
        ).style.display =
            "none";


        document.getElementById(
            "editUsername"
        ).value =
            "";


        document.getElementById(
            "editPassword"
        ).value =
            "";

    }



    // ==========================================
    // UPDATE USER
    // ==========================================

    function updateUser() {


        const userId =
            document.getElementById(
                "editUserId"
            ).value;


        const username =
            document.getElementById(
                "editUsername"
            ).value.trim();


        const password =
            document.getElementById(
                "editPassword"
            ).value;


        const role =
            document.getElementById(
                "editRole"
            ).value;


        if (username === "") {

            alert(
                "Please enter a username."
            );

            return;

        }


        if (
            password !== ""
            &&
            password.length < 6
        ) {

            alert(
                "Password must contain at least 6 characters."
            );

            return;

        }


        const formData =
            new URLSearchParams();


        formData.append(
            "action",
            "edit"
        );


        formData.append(
            "user_id",
            userId
        );


        formData.append(
            "username",
            username
        );


        formData.append(
            "password",
            password
        );


        formData.append(
            "role",
            role
        );


        fetch("user-management", {

            method: "POST",

            headers: {

                "Content-Type":
                    "application/x-www-form-urlencoded"

            },

            body: formData

        })


        .then(response => {

            return response.json();

        })


        .then(data => {


            if (data.success) {


                alert(
                    "User updated successfully!"
                );


                closeEditUserForm();


                loadUsers();


            } else {


                alert(
                    data.message ||
                    "Unable to update user."
                );

            }

        })


        .catch(error => {


            console.error(
                "Update User Error:",
                error
            );


            alert(
                "Unable to update user."
            );

        });

    }



    // ==========================================
    // DELETE USER
    // ==========================================

    function deleteUser(userId) {


        const confirmDelete =
            confirm(
                "Are you sure you want to delete this user?"
            );


        if (!confirmDelete) {

            return;

        }


        const formData =
            new URLSearchParams();


        formData.append(
            "action",
            "delete"
        );


        formData.append(
            "user_id",
            userId
        );


        fetch("user-management", {

            method: "POST",

            headers: {

                "Content-Type":
                    "application/x-www-form-urlencoded"

            },

            body: formData

        })


        .then(response => {

            return response.json();

        })


        .then(data => {


            if (data.success) {


                alert(
                    "User deleted successfully!"
                );


                loadUsers();


            } else {


                alert(
                    data.message ||
                    "Unable to delete user."
                );

            }

        })


        .catch(error => {


            console.error(
                "Delete User Error:",
                error
            );


            alert(
                "Unable to delete user."
            );

        });

    }



    // ==========================================
    // LOAD USERS WHEN PAGE OPENS
    // ==========================================

    loadUsers();


</script>
